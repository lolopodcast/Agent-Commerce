  m2_p1: "AIDA（Attention, Interest, Desire, Action）描述廣告如何說服人類；AIDMA 再加入 Memory（記憶）。電通（Dentsu）於 2004 年前後提出 AISAS（Attention, Interest, Search, Action, Share），加入網路時代消費者主動的「搜尋」與「分享」。這些模型描述的都是人類的心理與行為歷程。",
  m2_p2: "代理式商務的關鍵變化是：Search 這一步最先被代理人接手，而 Share 產生的評價與口碑，成為代理人判斷時引用的證據。",
  m2_p3: "雙軌決策漏斗把階段拆得更細：需求與認知（Awareness）、探索（Discovery）、資格篩選（Qualification）、考慮（Consideration）、授權（Authorization）、交易（Transaction）與顧客維繫（Retention）。需求與品牌偏好主要仍由人類形成；搜尋、比較與驗證最先由代理人執行；授權與交易則依委託程度而定。當條件不符或超出授權時，代理人應停止並請求人類確認，這就是人與代理人的任務交接（Human–Agent Handoff）。",
  m2_p4: "代理式商務不只發生在線上。O2O（Online to Offline）指以線上資訊或優惠把顧客帶到門市；OMO（Online-Merge-Offline）則進一步整合會員、庫存、交易與服務資料。代理人可以查詢門市即時庫存、安排線上買門市取（BOPIS）、預約試穿或維修。對服飾、美妝、家具等需要實體體驗的商品，OMO 能力決定代理人能否把顧客帶進門市；其前提是「單一顧客檢視」。",
  m2_terms: [
    { front: "AIDA", back: "Attention 注意、Interest 興趣、Desire 慾望、Action 行動；描述廣告如何說服人類。" },
    { front: "AISAS", back: "電通提出的網路時代模型：Attention、Interest、Search、Action、Share，加入搜尋與分享。" },
    { front: "雙軌決策漏斗 Dual-track Funnel", back: "人類軌與代理人軌並存的漏斗：認知、探索、資格篩選、考慮、授權、交易、維繫。" },
    { front: "任務交接 Human–Agent Handoff", back: "條件不符或超出授權時，代理人停止並把決定交回人類的機制。" },
    { front: "O2O Online to Offline", back: "以線上資訊、預約或優惠，把顧客導引到實體門市消費。" },
    { front: "OMO Online-Merge-Offline", back: "整合線上與門市的會員、庫存、交易與服務資料，讓顧客在任何通路得到一致體驗。" },
    { front: "BOPIS", back: "Buy Online, Pick up In Store：線上購買、門市取貨；代理人可依距離與庫存選擇門市。" }
  ],
  m2_wrapup: "從 AIDA 到 AISAS，再到雙軌決策漏斗，改變的是「誰在執行每一個階段」。需求與偏好仍主要由人類形成，搜尋與驗證最先交給代理人，授權與交易則視委託程度而定。分享出去的評價成為下一位顧客的代理人所引用的證據。同時，代理人也會連結線上與門市，OMO 的資料整合因此成為實體通路的關鍵能力。",
  m2_q: [
    { q: "AISAS 相較於 AIDMA，新增了哪兩個消費者主動行為？", opts: ["Desire 與 Memory", "Search 與 Share", "Interest 與 Action", "Awareness 與 Retention"], ans: _A1, exp: "AISAS 加入 Search（搜尋）與 Share（分享），反映網路時代的主動消費者。" },
    { q: "在代理式情境中，哪一個 AISAS 階段最先被代理人接手？", opts: ["Attention", "Interest", "Share", "Search"], ans: _A3, exp: "搜尋、比較與驗證是代理人最擅長、也最先接手的工作。" },
    { q: "Share 在代理式商務中的新角色是什麼？", opts: ["不再重要", "只影響廣告預算", "評價與口碑成為代理人判斷時引用的證據", "被代理人自動刪除"], ans: _A2, exp: "顧客分享的評價會回到檢索範圍，成為下一位顧客的代理人所引用的證據。" },
    { q: "當交易超出授權範圍時，代理人應如何處理？", opts: ["自行提高預算後完成交易", "停止並請求人類確認", "改向其他商家下單", "忽略限制直接付款"], ans: _A1, exp: "這是任務交接機制：超出授權即停止，交由人類決定。" },
    { q: "OMO 與 O2O 最主要的差異是？", opts: ["OMO 只做線上銷售", "O2O 強調資料融合", "OMO 進一步整合會員、庫存、交易與服務資料", "兩者完全相同"], ans: _A2, exp: "O2O 是導流到門市；OMO 是線上線下資料與體驗的融合。" },
    { q: "BOPIS 指的是什麼？", opts: ["線上購買、門市取貨", "門市購買、宅配到府", "線上預約、線上付款", "會員點數兌換"], ans: _A0, exp: "Buy Online, Pick up In Store，需要 OMS 與門市取貨流程支援。" }
  ],

  // ===== M3 =====
  m3_nav: "3. 賣家四道關卡與 GEO／KOL／KOC", m3_title: "賣家四道關卡與 GEO／KOL／KOC",
  m3_overview: "賣家如何讓代理人容易且經常找到、好選擇、好驗證，並能簡單又安全地完成交易？本模組把企業三種能力（說服、入選、執行）展開為四道關卡，並說明 GEO、KOL、KOC 在各關卡的角色轉變。",
  m3_highlights: ["找得到", "好選擇", "好驗證", "買得成", "GEO 與 ACO", "KOL 設定決策條件"],
  m3_p1: "第一關「找得到」：代理人從搜尋索引、商品 feed、平台與第三方內容中檢索。賣家要做好 SEO 基本功、把商品 feed 送進主要平台、以顧客的任務撰寫內容，並即時更新價格與庫存；資料過時的商家會被排除或降低排序。第二關「好選擇」：代理人依硬性條件篩選、依偏好排序。規格要完整並結構化、總價透明、差異化附上數據，並標明適用與不適用的情境。",
  m3_p2: "KOL 塑造人類的需求與判斷條件，KOC 提供真實的使用證據，GEO 確保這些內容與事實在 AI 答案中被正確引用。",
  m3_p3: "第三關「好驗證」：代理人會交叉比對多個來源。各通路資訊要一致，以測試、認證與真實評價取代形容詞，公開退換貨政策，並揭露贊助內容；不得在網頁中藏指令操縱代理人。第四關「買得成」：提供穩定的結帳流程，透過電商平台或支付業者支援商務協定，交易前即時確認價格與庫存，並設定金額上限與例外交由真人處理的護欄。",
  m3_p4: "Google 的官方指南認為一般 SEO 原則仍決定 AI 功能中的能見度，並不建議另採特殊的 AEO／GEO 手法。因此 GEO 的目標從「排名第幾」轉為「是否被提及、被推薦、描述是否正確」，主要對應人類詢問 AI 的 H1–H2 情境；ACO 則對應代理人篩選並交易的 H2–H3 情境。KOL／KOC 的價值從中段導流移向前端需求與後端證據：導購連結與折扣碼可能被代理人繞過，KOL 卻能設定消費者交給代理人的決策條件。",
  m3_p5: "對中小賣家而言，優先順序是：先整理一份正確、完整、各通路一致的商品主資料；再做好網站與商品 feed；累積可查證的第三方證據；使用平台既有的代理結帳功能；最後每季以固定情境題庫檢測 AI 可見度，找出未入選的原因並修正資料。",
  m3_terms: [
    { front: "GEO 生成式引擎最佳化", back: "Generative Engine Optimization：讓資訊在生成式 AI 回答中被提及、被引用並被正確描述。" },
    { front: "ACO 代理式商務最佳化", back: "Agentic Commerce Optimization：提升代理人評估、入選與交易成功率的延伸概念，尚非統一標準。" },
    { front: "KOL 關鍵意見領袖", back: "以專業或聲譽影響消費者；在代理式商務中能設定消費者交給代理人的決策條件。" },
    { front: "KOC 關鍵意見消費者", back: "以真實使用經驗影響同儕；公開、具體的心得成為代理人查證的證據。" },
    { front: "商品 feed", back: "把商品規格、價格、庫存等資料整理成標準格式，同步到搜尋引擎與各電商平台。" },
    { front: "結構化資料 Schema", back: "以 Schema.org 等標準格式描述商品、價格與評價，讓機器能讀懂網頁內容。" },
    { front: "AI 可見度監測", back: "以固定情境題庫詢問主要 AI 助理，追蹤品牌被提及率、推薦率與資訊正確率。" }
  ],
  m3_wrapup: "賣家的工作可以濃縮為四道關卡：找得到、好選擇、好驗證、買得成。前三關對應「入選」能力，第四關對應「執行」能力。GEO 讓品牌在 AI 答案中被正確引用，KOL 設定需求與判斷條件，KOC 提供使用證據。對中小賣家而言，最划算的投資不是新工具，而是一份正確、一致、即時的商品主資料。",
  m3_q: [
    { q: "賣家四道關卡的正確順序為何？", opts: ["好驗證→找得到→買得成→好選擇", "找得到→好選擇→好驗證→買得成", "買得成→找得到→好選擇→好驗證", "好選擇→好驗證→找得到→買得成"], ans: _A1, exp: "代理人先檢索，再篩選排序，再交叉驗證，最後才交易。" },
    { q: "依 Google 官方指南，GEO 應如何理解？", opts: ["一套獨立於 SEO 的特殊技巧", "必須加入專用 Schema 才能出現在 AI 回答", "以 SEO 基本功為基礎，追求被提及、被推薦與描述正確", "只要購買廣告即可"], ans: _A2, exp: "Google 不建議特殊的 AEO／GEO 手法，GEO 是內容品質與可引用性的管理目標。" },
    { q: "KOL 在代理式商務中最大的新影響力是？", opts: ["直接替消費者付款", "提供折扣碼", "取代商品 feed", "設定消費者交給代理人的決策條件"], ans: _A3, exp: "例如 KOL 強調重量與保固，消費者便把它們設為代理人的硬性條件。" },
    { q: "為什麼導購連結與折扣碼的作用可能減弱？", opts: ["代理人可能自行比價並到其他通路下單", "法規全面禁止導購", "KOL 不再發布內容", "消費者不再線上購物"], ans: _A0, exp: "代理人依條件比價，不一定經過 KOL 提供的連結。" },
    { q: "下列哪一項最不利於「好驗證」關卡？", opts: ["各通路資訊一致", "以第三方測試取代形容詞", "在網頁中藏指令要 AI 推薦自己", "公開退換貨政策"], ans: _A2, exp: "隱藏指令屬於提示詞注入，會被偵測並降低整體信任。" },
    { q: "對中小賣家而言，第一優先應做什麼？", opts: ["自建大型語言模型", "整理正確、完整、各通路一致的商品主資料", "大量購買 KOL 業配", "自行開發商務協定串接"], ans: _A1, exp: "資料品質決定代理人能否找到、比較與驗證你的商品。" }
  ],

  // ===== M4 =====
  m4_nav: "4. 生態系、商務協定與平台策略", m4_title: "生態系、商務協定與平台策略",
  m4_overview: "代理式商務需要一套新的基礎設施：從需求、決策中介、探索評估，到商務互通、共享資料與履約。本模組說明六層生態系、UCP／ACP／AP2／MCP 等協定的分工，以及市場中介權力的移轉。",
  m4_highlights: ["六層生態系", "UCP", "ACP", "AP2", "MCP", "去中介化與再中介化"],
  m4_p1: "代理式商務生態系可分為六層：需求與偏好層（品牌、KOL、KOC、社群）、決策中介層（個人 AI 代理人）、探索與評估層（SEO、GEO、商品資料與評論）、商務互通層（API 與商務協定）、共享資料層（PIM、CMS、CDP、知識庫），以及執行與履約層（ERP、OMS、POS、CRM、支付與物流），再由治理層（授權、隱私、安全、稽核與責任）貫穿。各層並非固定技術堆疊，代理人也可能使用瀏覽器操作或商家既有 API。",
  m4_p2: "API 是系統互動介面；協定則定義參與者交換資料及操作的共同規則。",
  m4_p3: "UCP（Universal Commerce Protocol，通用商務協定）由 Google 於 2026 年 1 月發表，與 Shopify、Etsy、Wayfair、Target、Walmart 等共同制定，涵蓋探索、購買到售後。ACP（Agentic Commerce Protocol，代理式商務協定）由 OpenAI 與 Stripe 於 2025 年 9 月推出，涵蓋商品資料、結帳與委託支付。MCP（Model Context Protocol）提供 AI 應用連接工具與資料的通用機制，但不等於完整的交易或支付協定。支付憑證應依安全機制處理，不應直接交給模型。",
  m4_p4: "支付層另有專門機制：Google 於 2025 年 9 月發表 AP2（Agent Payments Protocol），用於證明使用者已授權代理人進行特定購買，可作為 A2A 與 UCP 的延伸；卡組織也推出 Visa Intelligent Commerce、Mastercard Agent Pay 等方案，以代幣化憑證與消費上限讓代理人代表消費者付款。這些機制與 UCP／ACP 互補，不必然互斥，但也不保證任意代理人與商家皆可互通，導入前須確認版本、地區與支援功能。",
  m4_p5: "市場中介權力可能從搜尋引擎與電商平台部分移轉到個人代理人，這是去中介化與再中介化並存的過程。企業可採封閉（自有代理人）、開放（接受第三方代理人）或混合策略。電商平台即使失去部分首頁流量，仍可能藉商品供給、支付、物流與履約服務取得價值。",
  m4_terms: [
    { front: "UCP 通用商務協定", back: "Google 主導、與多家零售與電商業者共同制定的開放標準，涵蓋探索、購買與售後。" },
    { front: "ACP 代理式商務協定", back: "OpenAI 與 Stripe 推出，規範商品資料、結帳與委託支付等代理式交易介面。" },
    { front: "AP2 代理支付協定", back: "Agent Payments Protocol：證明使用者已授權代理人進行特定購買，並支援安全付款。" },
    { front: "MCP", back: "Model Context Protocol：讓 AI 應用連接工具與資料的通用機制，不是完整的交易協定。" },
    { front: "API", back: "Application Programming Interface：系統之間交換資料與操作的介面。" },
    { front: "去中介化與再中介化", back: "舊中介（搜尋、平台）部分被繞過，同時出現新中介（個人代理人）的並存過程。" },
    { front: "代幣化憑證 Tokenization", back: "以代幣取代真實卡號，搭配消費上限與條件，讓代理人安全付款。" }
  ],
  m4_wrapup: "代理式商務的基礎設施由六層生態系加上治理層組成。UCP 與 ACP 處理商務流程，AP2 與卡組織方案處理授權付款，MCP 則讓 AI 連接工具與資料，各自分工而非互相取代。協定的存在不等於普遍可用，導入前要查核實際支援情況。市場權力正在部分移轉，但平台仍能透過供給與履約保有價值。",
  m4_q: [
    { q: "MCP（Model Context Protocol）的定位為何？", opts: ["完整的交易與支付協定", "讓 AI 應用連接工具與資料的通用機制", "卡組織的代理支付方案", "Google 的商品 feed 格式"], ans: _A1, exp: "MCP 是連接機制，不等於完整的交易或支付協定。" },
    { q: "UCP 是由誰主導發表？", opts: ["OpenAI 與 Stripe", "Visa", "Google，與 Shopify、Etsy、Wayfair、Target、Walmart 等共同制定", "Mastercard"], ans: _A2, exp: "UCP 於 2026 年 1 月由 Google 在美國零售聯合會年會發表。" },
    { q: "AP2 的主要用途是？", opts: ["證明使用者已授權代理人進行特定購買並安全付款", "管理商品圖片", "計算 RFM 分數", "監測社群聲量"], ans: _A0, exp: "AP2 處理授權、真實性與責任歸屬等付款問題。" },
    { q: "代理式交易中，支付憑證應如何處理？", opts: ["直接交給模型保存", "寫在網頁上供代理人讀取", "依安全機制處理，不直接交付給模型", "由 KOL 代為保管"], ans: _A2, exp: "憑證應透過代幣化等安全機制處理，模型不應接觸真實憑證。" },
    { q: "UCP 與 ACP 的關係，何者正確？", opts: ["必然互斥，只能擇一", "兩者完全相同", "ACP 是 UCP 的子規格", "不必然互斥，但也不保證任意代理人與商家皆可互通"], ans: _A3, exp: "導入前應查核版本、平台資格、地區與實際支援功能。" },
    { q: "電商平台即使失去部分首頁流量，仍可能藉什麼取得價值？", opts: ["商品供給、支付、物流與履約服務", "只靠首頁廣告", "退出市場", "停止與代理人合作"], ans: _A0, exp: "這是再中介化：平台從流量入口轉向履約與服務的價值。" }
  ],

  // ===== M5 =====
  m5_nav: "5. 傳統行銷工具的重構", m5_title: "傳統行銷工具的重構",
  m5_overview: "STP、人物誌、使用者旅程、4Ps、行銷漏斗與 CRM 並未失去價值，而是需要重構分析單位與實作方式。本模組把它們整合為「策略設計鏈」加上貫穿全程的「衡量與顧客經營層」。",
  m5_highlights: ["策略設計鏈", "STP＋委託程度", "代理決策設定檔", "服務藍圖", "雙軌漏斗 KPI", "CRM 與 RFM"],
  m5_p1: "設計鏈依序推進：市場研究 → STP → 人物誌 → 旅程 → 4Ps → 執行（網站、SEO／GEO、社群、API 與協定）。另一方面，Funnel 與 CRM 構成平行的衡量與顧客經營層：Funnel 衡量各階段的轉換與流失，CRM 經營成交後的顧客關係與價值，兩者共同提供回饋給市場研究與 4Ps。",
  m5_p2: "Funnel 與 CRM 不是流程的最後一步，而是貫穿整段旅程的平行層。",
  m5_p3: "STP 的區隔變數新增任務標準化程度、購買頻率、風險、委託程度與代理通路使用；定位則要讓差異化可被代理人理解、比較與查核。人物誌不應虛構具有情感與人口屬性的 Bot Persona，而是加上「代理決策設定檔（Delegation Profile）」：任務目標、硬性限制、可權衡偏好、可信來源、決策權限（可搜尋、可推薦、可下單、付款上限）與例外處理。",
  m5_p4: "旅程要畫成人類軌與代理人軌的雙軌旅程，並用服務藍圖連結前臺與後臺，標示任務交接與例外流程；體驗設計也從 UI/UX 延伸到代理人體驗（AX）：資料可讀、工具可用、錯誤可復原、權限可控。4Ps 方面，產品要可驗證、價格要即時與透明、通路要涵蓋代理生態系、推廣要同時創造人類需求並提供可信內容。",
  m5_p5: "漏斗指標新增 AI 提及率、推薦率、候選清單入選率、授權完成率與交易成功率，且分母必須一致，不可把 AI 測試回答與實際訂單混用。CRM 以 RFM 評估顧客價值：R 最近一次、F 購買頻率、M 消費金額。代理人自動補貨可能推高 R 與 F，比價可能壓低單價，因此宜依通路分別計算並改看毛利。Reinartz 與 Kumar 的研究也提醒，關係長度與獲利僅弱到中度相關，RFM 高不等於忠誠。",
  m5_terms: [
    { front: "STP", back: "Segmentation 區隔、Targeting 目標市場選擇、Positioning 定位；代理式情境加入委託程度等變數。" },
    { front: "代理決策設定檔 Delegation Profile", back: "記錄任務目標、硬性限制、偏好權重、可信來源、決策權限與例外處理，而非虛構 Bot 人格。" },
    { front: "服務藍圖 Service Blueprint", back: "連結顧客可見的前臺接觸點與後臺流程，標示交接與例外。" },
    { front: "代理人體驗 AX", back: "Agent Experience：資料可讀性、工具可用性、錯誤可復原性與權限可控性。" },
    { front: "候選清單入選率", back: "Shortlist Inclusion Rate：品牌入選候選清單的情境數 ÷ 有候選清單的有效情境數。" },
    { front: "RFM", back: "R 最近一次、F 購買頻率、M 消費金額；評估顧客價值的分群模型。" },
    { front: "CLV 顧客終身價值", back: "Customer Lifetime Value：顧客在整段關係中預估貢獻的毛利。" }
  ],
  m5_wrapup: "傳統行銷工具不是被 AI 淘汰，而是成為管理 AI 中介市場的基礎方法。設計鏈從 STP 推進到執行，衡量與顧客經營層則貫穿全程。重點是加入委託程度、代理決策設定檔、雙軌旅程與代理人體驗，並用一致的分母衡量漏斗；CRM 則要依通路解讀 RFM，避免把代理人的自動行為誤認為品牌忠誠。",
  m5_q: [
    { q: "在重構後的架構中，Funnel 與 CRM 的定位是？", opts: ["設計鏈的最後一步", "貫穿整段旅程的平行衡量與顧客經營層", "可以省略的舊工具", "只在售後使用"], ans: _A1, exp: "Funnel 衡量各階段轉換，CRM 經營顧客價值，兩者平行貫穿全程。" },
    { q: "代理決策設定檔與 Bot Persona 的差別是？", opts: ["前者記錄任務目標、限制、授權與例外，不虛構代理人的情感與人口屬性", "前者替代理人設定性別與年齡", "兩者完全相同", "前者只用於企業採購"], ans: _A0, exp: "代理人是決策中介者，不是具獨立消費需求的人口區隔。" },
    { q: "代理式商務在 STP 中新增的區隔變數包括？", opts: ["只看年齡與所得", "只看地理區域", "委託程度、任務標準化程度、代理通路使用", "品牌顏色偏好"], ans: _A2, exp: "同一人口族群可能呈現不同的委託行為。" },
    { q: "候選清單入選率的計算方式為何？", opts: ["品牌入選候選清單的情境數 ÷ 有候選清單的有效情境數", "網站造訪數 ÷ 廣告曝光數", "成交數 ÷ 網站造訪數", "評論數 ÷ 商品數"], ans: _A0, exp: "分母必須是有效、可比較的測試情境。" },
    { q: "代理人自動補貨對 RFM 的影響，何者正確？", opts: ["會降低 R 與 F", "可能推高 R 與 F，未必代表品牌偏好", "與 RFM 無關", "只影響 M"], ans: _A1, exp: "應區分人類主動購買與代理自動購買。" },

  // ===== M6 =====
  m6_nav: "6. 工具、組織、路線圖與治理", m6_title: "工具、組織、路線圖與治理",
  m6_overview: "要把策略做出來，需要對應的 AI 與數位工具、跨部門的組織設計、分階段的轉型路線圖，以及風險治理。本模組整理七層工具堆疊、組織轉型的五個構面、三階段路線圖與 G1–G4 決策關卡。",
  m6_highlights: ["七層工具堆疊", "先資料後工具", "代理通路小組", "資料負責人", "G1–G4 決策關卡", "風險治理"],
  m6_p1: "工具依生態系分為七層：需求與偏好層（社群聆聽、生成式內容、網紅合作管理）、探索與評估層（網站搜尋診斷、結構化資料、商品 feed 管理、AI 可見度監測、評價管理）、企業代理人層（企業代理人平台、行銷自動化、AI 客服代理）、商務互通層（API 閘道、UCP／ACP、AP2、MCP）、共享資料層（PIM、CMS、CDP、知識庫與 RAG、資料倉儲）、執行與履約層（ERP、OMS、POS、CRM、支付與詐欺偵測、物流）與衡量治理層（網站分析、BI、A/B 實驗、MMM、同意管理、稽核紀錄）。",
  m6_p2: "先資料、後工具：一份正確、完整、各通路一致的商品主資料，效果勝過任何新導入的 AI 工具。",
  m6_p3: "代理式商務不是行銷部門單獨能完成的專案。組織結構要從功能分立轉為跨功能的代理通路小組；決策權從人工審核每項活動，轉為人設定目標與護欄、代理人在範圍內執行、例外交給人；商品與顧客資料視為資料產品，有明確的資料負責人；績效指標加入入選率、交易成功率與依通路的 RFM／CLV；文化轉向實驗與證據導向，同時保留品牌與倫理判斷。",
  m6_p4: "路線圖分三階段：0–3 個月建立代理人就緒資訊（資料盤點、基準 KPI、AI 可見度測試）；3–12 個月建立代理人就緒商務（API、授權與例外測試、單一通路試行）；12–24 個月發展代理式商業模式（擴大互通、評估自有代理人、治理稽核）。每階段以四道決策關卡把關：G1 資料是否正確完整、G2 代理通路需求是否可測量、G3 授權與付款風控是否完備、G4 增量毛利是否足以支應成本。G3 未通過，不得啟用自主交易。",
  m6_p5: "主要風險包括代理人錯誤推薦、過時價格與庫存、提示詞注入、未授權交易、支付詐欺、隱私、商業利益衝突與顧客關係被中介。對應的控制措施有權威資料與時間戳記、交易前即時確認、隔離指令與資料、金額上限與確認關卡、資料最小化，以及揭露廣告與佣金。整體而言，競爭邏輯正從注意力經濟、推薦經濟，延伸到委託經濟：讓人類信任我，並讓獲授權的代理人選擇我。",
  m6_terms: [

  m6_wrapup: "策略要付諸實行，需要工具、組織與節奏三者配合。工具依七層生態系選用，但先資料、後工具；組織從功能分立轉為跨功能小組，並讓每份資料有負責人；轉型分三階段推進，以 G1–G4 決策關卡把關，授權與風控未完備前不啟用自主交易。數位行銷的任務因此從流量經營，延伸到需求創造、決策中介、商務互通與顧客價值管理。",

  m0_nav: "0. Executive Summary", m0_title: "Executive Summary: A Structural Shift to Agentic Commerce",
  m0_intro: "Consumers are increasingly delegating searching, comparing, ordering, paying and after-sales management to personal AI agents. This is not just firms automating marketing with AI; it is a structural change on the demand side. Firms must now serve both humans and the agents that make decisions on their behalf. Based on version 1.6 of the Agentic Marketing and Agentic Commerce document, this course starts with the big picture and shows how consumer decision models have evolved from AIDA and AISAS into a dual-track decision funnel. It then explains how sellers can pass four gates — be found, be chosen, be verified and be bought — and the new roles of GEO, KOLs and KOCs. Next, it introduces commerce protocols and agent payments such as UCP, ACP and AP2, and reintegrates STP, personas, journeys, the 4Ps, the funnel and CRM. Finally, it covers the AI and digital tools required, organisational change, a transformation roadmap and governance. After the six modules, you can assess a firm's agent readiness in the Interactive Lab.",
  m0_why: "Why does agentic commerce matter?",
  m0_why_desc: "Firms used to work hard to bring consumers to their websites. Now they must also get their products and services into the consumer's agent's decision flow. Products that agents cannot find, understand and verify may never reach the customer at all.",
  m0_modules: [
    { num: "01", title: "The Big Picture & Core Concepts", desc: "Demand-side delegation, key concepts, delegation levels H0–H3 and maturity." },
    { num: "02", title: "Decision Models, Dual-track Journey & OMO", desc: "AIDA → AISAS → the dual-track funnel, plus online–offline integration." },
    { num: "03", title: "Seller Gates & GEO / KOL / KOC", desc: "Be found, be chosen, be verified, be bought — and the new roles of each." },
    { num: "04", title: "Ecosystem, Protocols & Platform Strategy", desc: "Six-layer ecosystem, UCP / ACP / AP2 / MCP and shifting intermediary power." },
    { num: "05", title: "Marketing Frameworks Revisited", desc: "STP, personas, journeys, the 4Ps, the funnel, CRM and RFM." },
    { num: "06", title: "Tools, Organisation, Roadmap & Governance", desc: "Seven-layer tool stack, organisational change, gates and risk control." }
  ],

  // ===== M1 =====
  m1_nav: "1. The Big Picture & Core Concepts", m1_title: "The Big Picture & Core Concepts",
  m1_overview: "Agentic commerce does not start with a new tool for firms but with a change in consumer behaviour: people are beginning to delegate shopping tasks to personal AI agents. This module distinguishes the key concepts, introduces delegation levels H0–H3 and reviews maturity as of November 2026.",
  m1_highlights: ["Demand-side delegation", "Personal AI agent", "Agentic Marketing", "Agentic Commerce", "Delegation levels H0–H3", "Maturity L1–L5"],
  m1_p1: "Several concepts need to be separated first. AI-assisted marketing means marketers use AI to analyse data and produce content. Agentic marketing means agents plan, execute, monitor and adjust marketing work towards goals; in a broad sense it also includes marketing to consumers' agents. Agentic commerce means agents take part in product discovery, purchase decisions and authorised commercial operations. At the far end, autonomous commerce means agents complete transactions and follow-up management on their own within clear authorisations and limits.",
  m1_p2: "A personal agent on the demand side should act on the consumer's preferences and authorisation, while a firm's agent on the supply side pursues marketing and operating goals. Their interests are not necessarily aligned — this is the core strategic tension of agentic commerce.",
  m1_p3: "Delegation has four levels: H0, the human decides; H1, the agent assists with information search; H2, the agent filters and recommends and the human confirms; H3, the agent executes the transaction within set authority. Delegation is task-level, not a fixed personality trait: the same customer may hand toilet paper to H3 but stop at H2 for an expensive laptop and make the final call themselves.",
  m1_p4: "Based on a qualitative judgement of technical and commercial deployment, L1 content generation and data analysis is relatively mature; L2 firm agents planning and running marketing are being commercialised; L3 consumer agents that explore, compare and recommend are developing fast; L4 building carts, checkout and authorised payment is deployed in some markets and by some merchants; L5 autonomous purchasing, replenishment and after-sales remain early and conditional. These levels are not market-penetration statistics and do not mean fully autonomous buying is mainstream.",
  m1_terms: [
    { front: "Personal AI Agent", back: "An AI assistant that searches, compares and recommends for a consumer and can order and pay within authorisation; also called a personal bot or daily agent." },
    { front: "Agentic Marketing", back: "Agents plan, execute, monitor and adjust marketing towards goals; broadly, it also includes marketing to consumers' agents." },
    { front: "Agentic Commerce", back: "Agents take part in discovery, purchase decisions and authorised operations, involving consumers, agents, merchants and payment providers." },
    { front: "Autonomous Commerce", back: "Agents execute transactions and follow-up on their own within clear authorisation and limits; still early and conditional." },
    { front: "Delegation Levels H0–H3", back: "H0 self-decide, H1 assisted search, H2 recommend then human confirms, H3 transact within authority; set per task, not per person." },
    { front: "Principal–Agent Problem", back: "Does the agent faithfully represent the consumer rather than advertisers or commission sources? A core governance issue." }
  ],
  m1_wrapup: "The essence of agentic commerce is delegation on the demand side. Firms no longer face only humans browsing web pages but also agents that search, compare and transact on their behalf. Knowing how the concepts differ, that delegation is set per task, and that L4 and L5 are still early is the basis for later strategy: do not ignore the shift, but do not overestimate how fast autonomous buying will spread. Always ask, too: whose interests does the agent really serve?",
  m1_q: [
    { q: "What best describes the starting point of agentic commerce?", opts: ["Firms adopting more marketing automation tools", "Consumers delegating search, comparison and transactions to personal AI agents", "Search engines switching to a new ranking algorithm", "E-commerce platforms abolishing websites"], ans: _A1, exp: "It starts with a change in demand-side behaviour, not just a tool upgrade on the firm side." },
    { q: "Which statement about delegation levels H0–H3 is correct?", opts: ["They are a customer's fixed personality trait", "H3 means the human decides alone", "The same customer uses different levels for different purchase tasks", "They apply only to corporate purchasing"], ans: _A2, exp: "Delegation is task-level: toilet paper may be H3, an expensive laptop H2." },
    { q: "What does H2 mean?", opts: ["The human decides alone", "The agent assists with information search", "The agent filters and recommends, the human confirms", "The agent transacts within authority"], ans: _A2, exp: "At H2 the agent filters and recommends, but the human makes the final decision." },
    { q: "How do personal agents and firm agents relate?", opts: ["Their interests are always aligned", "Firm agents must obey consumer agents", "They never interact", "Their interests are not necessarily aligned, creating strategic tension"], ans: _A3, exp: "Personal agents follow consumer preferences; firm agents pursue operating goals. They can conflict." },
    { q: "As of November 2026, how mature is L5 (autonomous purchasing and after-sales)?", opts: ["Early and conditional", "Relatively mature", "Already mainstream", "Fully standardised"], ans: _A0, exp: "L5 is limited by liability, risk, trust, authorisation and regulation." },
    { q: "What kind of data are maturity levels L1–L5?", opts: ["Official market-penetration statistics", "A qualitative judgement based on technical and commercial deployment", "Consumer survey results", "National regulatory tiers"], ans: _A1, exp: "The document states they are qualitative judgements, not penetration rates or surveys." }
  ],

  // ===== M2 =====
  m2_nav: "2. Decision Models, Dual-track Journey & OMO", m2_title: "Decision Models, Dual-track Journey & OMO",
  m2_overview: "Consumer decision models have evolved from AIDA in the mass-media era and AISAS in the internet era into a dual-track funnel where humans and agents coexist. This module compares the three models, shows where agents step in, and extends to O2O and OMO, which connect online and offline.",
  m2_highlights: ["AIDA", "AISAS", "Dual-track funnel", "Search taken over first", "Share becomes evidence", "O2O / OMO"],
  m2_p1: "AIDA (Attention, Interest, Desire, Action) describes how advertising persuades people; AIDMA adds Memory. Around 2004, Dentsu proposed AISAS (Attention, Interest, Search, Action, Share), adding the active searching and sharing of internet-era consumers. All of these models describe human psychological and behavioural processes.",
  m2_p2: "The key change in agentic commerce is this: Search is the first step agents take over, and the reviews and word of mouth created by Share become the evidence agents cite when they judge.",
  m2_p3: "The dual-track funnel splits the stages more finely: Awareness, Discovery, Qualification, Consideration, Authorization, Transaction and Retention. Needs and brand preferences are still formed mainly by humans; searching, comparing and verifying are taken over first by agents; authorisation and transaction depend on the delegation level. When conditions are not met or authority is exceeded, the agent should stop and ask the human to confirm — this is the human–agent handoff.",
  m2_p4: "Agentic commerce does not happen only online. O2O (Online to Offline) uses online information or offers to bring customers into stores; OMO (Online-Merge-Offline) goes further and integrates membership, inventory, transaction and service data. Agents can check live store stock, arrange buy-online-pick-up-in-store (BOPIS), and book fittings or repairs. For fashion, beauty, furniture and other products that need a physical experience, OMO capability decides whether agents can bring customers into stores; its precondition is a single customer view.",
  m2_terms: [
    { front: "AIDA", back: "Attention, Interest, Desire, Action — how advertising persuades people." },
    { front: "AISAS", back: "Dentsu's internet-era model: Attention, Interest, Search, Action, Share, adding search and sharing." },
    { front: "Dual-track Funnel", back: "A funnel with a human track and an agent track: awareness, discovery, qualification, consideration, authorisation, transaction, retention." },
    { front: "Human–Agent Handoff", back: "The mechanism by which an agent stops and returns the decision to the human when conditions or authority are exceeded." },
    { front: "O2O — Online to Offline", back: "Using online information, bookings or offers to bring customers into physical stores." },
    { front: "OMO — Online-Merge-Offline", back: "Integrating online and store membership, inventory, transaction and service data for a consistent experience in any channel." },
    { front: "BOPIS", back: "Buy Online, Pick up In Store; agents can choose a store by distance and stock." }
  ],
  m2_wrapup: "From AIDA to AISAS to the dual-track funnel, what changes is who performs each stage. Needs and preferences are still formed mainly by humans, search and verification pass to agents first, and authorisation and transaction depend on the delegation level. Shared reviews become the evidence that the next customer's agent cites. Agents also connect online and stores, so OMO data integration becomes a key capability for physical channels.",
  m2_q: [
    { q: "Compared with AIDMA, which two active behaviours does AISAS add?", opts: ["Desire and Memory", "Search and Share", "Interest and Action", "Awareness and Retention"], ans: _A1, exp: "AISAS adds Search and Share, reflecting active internet-era consumers." },
    { q: "In an agentic setting, which AISAS stage do agents take over first?", opts: ["Attention", "Interest", "Share", "Search"], ans: _A3, exp: "Searching, comparing and verifying are what agents do best and take over first." },
    { q: "What is the new role of Share in agentic commerce?", opts: ["It no longer matters", "It only affects ad budgets", "Reviews and word of mouth become evidence agents cite", "Agents delete it automatically"], ans: _A2, exp: "Shared reviews return to the searchable pool and become evidence for the next customer's agent." },
    { q: "When a transaction exceeds authority, what should the agent do?", opts: ["Raise the budget itself and complete the purchase", "Stop and ask the human to confirm", "Order from another merchant", "Ignore the limit and pay"], ans: _A1, exp: "This is the handoff mechanism: stop when authority is exceeded and let the human decide." },
    { q: "What is the main difference between OMO and O2O?", opts: ["OMO is online-only", "O2O emphasises data integration", "OMO further integrates membership, inventory, transaction and service data", "They are identical"], ans: _A2, exp: "O2O drives traffic to stores; OMO merges online and offline data and experience." },
    { q: "What does BOPIS mean?", opts: ["Buy online, pick up in store", "Buy in store, home delivery", "Book online, pay online", "Redeem loyalty points"], ans: _A0, exp: "Buy Online, Pick up In Store — supported by an OMS and in-store pickup process." }
  ],

  // ===== M3 =====
  m3_nav: "3. Seller Gates & GEO / KOL / KOC", m3_title: "Seller Gates & GEO / KOL / KOC",
  m3_overview: "How can sellers make agents find them easily and often, choose and verify them readily, and complete purchases simply and safely? This module unfolds the firm's three capabilities (persuasion, selection, execution) into four gates and explains how the roles of GEO, KOLs and KOCs change at each gate.",
  m3_highlights: ["Be found", "Be chosen", "Be verified", "Be bought", "GEO vs ACO", "KOLs set decision criteria"],
  m3_p1: "Gate 1, be found: agents retrieve from search indexes, product feeds, platforms and third-party content. Sellers need solid SEO basics, product feeds sent to the main platforms, content written around customers' tasks, and live prices and stock; merchants with stale data are excluded or ranked lower. Gate 2, be chosen: agents filter by hard constraints and rank by preferences. Specifications should be complete and structured, total prices transparent, differentiation backed by data, and suitable and unsuitable uses stated clearly.",
  m3_p2: "KOLs shape human needs and decision criteria, KOCs supply real usage evidence, and GEO makes sure this content and the facts are cited correctly in AI answers.",
  m3_p3: "Gate 3, be verified: agents cross-check several sources. Information must match across channels; tests, certifications and genuine reviews should replace adjectives; return policies should be public; and sponsored content must be disclosed. Never hide instructions in web pages to manipulate agents. Gate 4, be bought: offer a stable checkout, support commerce protocols through your e-commerce platform or payment provider, re-confirm price and stock before the transaction, and set guardrails such as spending limits and handing exceptions to a human.",
  m3_p4: "Google's official guidance holds that ordinary SEO principles still determine visibility in AI features and advises against special AEO or GEO tactics. GEO therefore shifts from 'what rank are we' to 'are we mentioned, recommended and described correctly', mainly in H1–H2 settings where people ask AI; ACO covers H2–H3 settings where agents filter and transact. The value of KOLs and KOCs moves from mid-funnel traffic to up-front demand and back-end evidence: affiliate links and discount codes may be bypassed by agents, but KOLs can set the criteria consumers hand to their agents.",
  m3_p5: "For small and medium sellers, the order of priority is: first, build one correct and complete product master data set that is consistent across channels; then get the website and product feeds right; build verifiable third-party evidence; use the agent checkout features your platform already offers; and every quarter, test AI visibility with a fixed set of scenario prompts to find why you were not shortlisted and fix the data.",
  m3_terms: [
    { front: "GEO — Generative Engine Optimisation", back: "Making information mentioned, cited and correctly described in generative AI answers." },
    { front: "ACO — Agentic Commerce Optimisation", back: "An extended concept for improving agent evaluation, shortlisting and transaction success; not yet a standard." },
    { front: "KOL — Key Opinion Leader", back: "Influences consumers through expertise or reputation; can set the decision criteria consumers hand to agents." },
    { front: "KOC — Key Opinion Consumer", back: "Influences peers through real usage; public, specific reviews become evidence agents check." },
    { front: "Product Feed", back: "Product specs, prices and stock in a standard format, synced to search engines and e-commerce platforms." },
    { front: "Structured Data (Schema)", back: "Describing products, prices and reviews in standard formats such as Schema.org so machines can read pages." },
    { front: "AI Visibility Monitoring", back: "Asking major AI assistants a fixed set of scenario prompts to track mention rate, recommendation rate and accuracy." }
  ],
  m3_wrapup: "A seller's work comes down to four gates: be found, be chosen, be verified and be bought. The first three express the selection capability; the fourth expresses execution. GEO keeps the brand cited correctly in AI answers, KOLs set needs and criteria, and KOCs provide usage evidence. For small sellers, the best investment is not a new tool but correct, consistent, up-to-date product master data.",
  m3_q: [
    { q: "What is the correct order of the four seller gates?", opts: ["Verified → found → bought → chosen", "Found → chosen → verified → bought", "Bought → found → chosen → verified", "Chosen → verified → found → bought"], ans: _A1, exp: "Agents retrieve first, then filter and rank, then cross-check, and only then transact." },
    { q: "According to Google's guidance, how should GEO be understood?", opts: ["A special technique separate from SEO", "You must add special schema to appear in AI answers", "Built on SEO basics, aiming to be mentioned, recommended and described correctly", "Simply buy ads"], ans: _A2, exp: "Google advises against special AEO/GEO tactics; GEO is a goal of content quality and citability." },
    { q: "What is the biggest new influence of KOLs in agentic commerce?", opts: ["Paying on the consumer's behalf", "Providing discount codes", "Replacing product feeds", "Setting the decision criteria consumers hand to their agents"], ans: _A3, exp: "If a KOL stresses weight and warranty, consumers make them hard constraints for their agents." },
    { q: "Why might affiliate links and discount codes lose power?", opts: ["Agents may compare prices and order through other channels", "Regulation bans affiliate marketing", "KOLs stop publishing", "Consumers stop shopping online"], ans: _A0, exp: "Agents compare by criteria and do not necessarily go through the KOL's link." },
    { q: "Which of these harms the 'be verified' gate most?", opts: ["Consistent information across channels", "Third-party tests instead of adjectives", "Hiding instructions in pages telling AI to recommend you", "Public return policies"], ans: _A2, exp: "Hidden instructions are prompt injection; they get detected and reduce overall trust." },
    { q: "What should a small seller do first?", opts: ["Build its own large language model", "Build correct, complete product master data consistent across channels", "Buy lots of sponsored KOL posts", "Develop its own protocol integration"], ans: _A1, exp: "Data quality decides whether agents can find, compare and verify your products." }
  ],

  // ===== M4 =====
  m4_nav: "4. Ecosystem, Protocols & Platform Strategy", m4_title: "Ecosystem, Protocols & Platform Strategy",
  m4_overview: "Agentic commerce needs new infrastructure: from demand and decision intermediation to discovery, interoperability, shared data and fulfilment. This module explains the six-layer ecosystem, how UCP, ACP, AP2 and MCP divide the work, and the shift in intermediary power.",
  m4_highlights: ["Six-layer ecosystem", "UCP", "ACP", "AP2", "MCP", "Dis- and re-intermediation"],
  m4_p1: "The agentic commerce ecosystem has six layers: demand and preference (brand, KOLs, KOCs, communities); decision intermediation (personal AI agents); discovery and evaluation (SEO, GEO, product data and reviews); commerce interoperability (APIs and protocols); shared data (PIM, CMS, CDP, knowledge bases); and execution and fulfilment (ERP, OMS, POS, CRM, payment and logistics) — with a governance layer (authorisation, privacy, security, audit and accountability) running across them. The layers are not a fixed tech stack; agents may also operate browsers or use merchants' existing APIs.",
  m4_p2: "An API is an interface for systems to interact; a protocol defines the shared rules by which participants exchange data and operations.",
  m4_p3: "UCP (Universal Commerce Protocol) was announced by Google in January 2026 and co-developed with Shopify, Etsy, Wayfair, Target, Walmart and others, covering discovery through purchase to after-sales. ACP (Agentic Commerce Protocol) was launched by OpenAI and Stripe in September 2025, covering product data, checkout and delegated payment. MCP (Model Context Protocol) gives AI applications a general way to connect to tools and data, but it is not a full transaction or payment protocol. Payment credentials should be handled by secure mechanisms and never handed directly to the model.",
  m4_p4: "The payment layer has its own mechanisms. In September 2025 Google announced AP2 (Agent Payments Protocol) to prove that a user authorised an agent to make a specific purchase; it can extend A2A and UCP. Card networks have launched programmes such as Visa Intelligent Commerce and Mastercard Agent Pay, using tokenised credentials and spending limits so agents can pay on consumers' behalf. These complement UCP and ACP and are not necessarily mutually exclusive, but they do not guarantee that any agent can work with any merchant; check versions, regions and supported features first.",
  m4_p5: "Intermediary power may shift partly from search engines and e-commerce platforms to personal agents — a process where disintermediation and reintermediation happen together. Firms can choose closed (own agent), open (accept third-party agents) or hybrid strategies. Even if e-commerce platforms lose some homepage traffic, they can still capture value through product supply, payment, logistics and fulfilment services.",
  m4_terms: [
    { front: "UCP — Universal Commerce Protocol", back: "An open standard led by Google and co-developed with retailers and e-commerce firms, covering discovery, purchase and after-sales." },
    { front: "ACP — Agentic Commerce Protocol", back: "Launched by OpenAI and Stripe; specifies product data, checkout and delegated payment for agentic transactions." },
    { front: "AP2 — Agent Payments Protocol", back: "Proves a user authorised an agent to make a specific purchase and supports secure payment." },
    { front: "MCP", back: "Model Context Protocol: a general way for AI applications to connect to tools and data; not a full transaction protocol." },
    { front: "API", back: "Application Programming Interface: the interface through which systems exchange data and operations." },
    { front: "Dis- and Re-intermediation", back: "Old intermediaries (search, platforms) are partly bypassed while new ones (personal agents) emerge." },
    { front: "Tokenisation", back: "Replacing real card numbers with tokens, combined with limits and conditions, so agents can pay safely." }
  ],
  m4_wrapup: "The infrastructure of agentic commerce is a six-layer ecosystem plus governance. UCP and ACP handle the commerce flow, AP2 and card-network programmes handle authorised payment, and MCP connects AI to tools and data; they divide the work rather than replace one another. A protocol existing does not mean it is widely available, so check real support before adopting. Market power is shifting partly, but platforms can still keep value through supply and fulfilment.",
  m4_q: [
    { q: "What is the role of MCP (Model Context Protocol)?", opts: ["A complete transaction and payment protocol", "A general way for AI applications to connect to tools and data", "A card network's agent payment programme", "Google's product feed format"], ans: _A1, exp: "MCP is a connection mechanism, not a full transaction or payment protocol." },
    { q: "Who led the announcement of UCP?", opts: ["OpenAI and Stripe", "Visa", "Google, co-developed with Shopify, Etsy, Wayfair, Target, Walmart and others", "Mastercard"], ans: _A2, exp: "Google announced UCP in January 2026 at the National Retail Federation conference." },
    { q: "What is AP2 mainly for?", opts: ["Proving a user authorised an agent's specific purchase and paying securely", "Managing product images", "Calculating RFM scores", "Monitoring social buzz"], ans: _A0, exp: "AP2 addresses authorisation, authenticity and accountability in payments." },
    { q: "How should payment credentials be handled in agentic transactions?", opts: ["Given directly to the model to store", "Written on the web page for agents to read", "Handled by secure mechanisms, never handed directly to the model", "Kept by a KOL"], ans: _A2, exp: "Credentials should go through tokenisation and other secure mechanisms; models should not touch real credentials." },
    { q: "Which statement about UCP and ACP is correct?", opts: ["They are mutually exclusive; pick one", "They are identical", "ACP is a sub-specification of UCP", "They are not necessarily exclusive, but do not guarantee any agent can work with any merchant"], ans: _A3, exp: "Before adopting, check versions, platform eligibility, regions and supported features." },
    { q: "Even if e-commerce platforms lose homepage traffic, how can they still capture value?", opts: ["Through product supply, payment, logistics and fulfilment services", "Only through homepage ads", "By leaving the market", "By refusing to work with agents"], ans: _A0, exp: "This is reintermediation: from traffic gateway to fulfilment and service value." }
  ],

  // ===== M5 =====
  m5_nav: "5. Marketing Frameworks Revisited", m5_title: "Marketing Frameworks Revisited",
  m5_overview: "STP, personas, user journeys, the 4Ps, the marketing funnel and CRM have not lost their value, but their unit of analysis and practice need rebuilding. This module integrates them into a strategy design chain plus a measurement and customer management layer that runs throughout.",
  m5_highlights: ["Design chain", "STP + delegation", "Delegation profile", "Service blueprint", "Dual-track funnel KPIs", "CRM and RFM"],
  m5_p1: "The design chain moves in order: market research → STP → persona → journey → 4Ps → execution (website, SEO/GEO, social, APIs and protocols). Alongside it, the funnel and CRM form a parallel measurement and customer management layer: the funnel measures conversion and drop-off at each stage, and CRM manages relationships and value after the sale. Together they feed back into market research and the 4Ps.",
  m5_p2: "The funnel and CRM are not the last step of the process; they are a parallel layer that runs through the entire journey.",
  m5_p3: "STP adds segmentation variables such as task standardisation, purchase frequency, risk, delegation level and agent-channel use; positioning must make differentiation understandable, comparable and verifiable by agents. Personas should not invent a Bot Persona with feelings and demographics; instead, add a Delegation Profile: task goals, hard constraints, trade-off preferences, trusted sources, decision rights (may search, recommend, order, payment limit) and exception handling.",
  m5_p4: "Journeys should be drawn as dual tracks for humans and agents, using a service blueprint to link front stage and back stage and to mark handoffs and exceptions. Experience design extends from UI/UX to agent experience (AX): readable data, usable tools, recoverable errors and controllable permissions. In the 4Ps, products must be verifiable, prices live and transparent, place must cover agent ecosystems, and promotion must both create human demand and provide credible content.",
  m5_p5: "Funnel metrics add AI mention rate, recommendation rate, shortlist inclusion rate, authorisation completion rate and transaction success rate, with consistent denominators — never mix AI test answers with real orders. CRM uses RFM to assess customer value: R recency, F frequency, M monetary value. Agent auto-replenishment can push R and F up, and price comparison can push unit prices down, so calculate by channel and use margin. Reinartz and Kumar's research also warns that relationship length correlates only weakly to moderately with profit; a high RFM score does not equal loyalty.",
  m5_terms: [
    { front: "STP", back: "Segmentation, Targeting, Positioning; agentic settings add variables such as delegation level." },
    { front: "Delegation Profile", back: "Records task goals, hard constraints, preference weights, trusted sources, decision rights and exceptions — not an invented bot personality." },
    { front: "Service Blueprint", back: "Links customer-facing touchpoints with back-stage processes and marks handoffs and exceptions." },

    { front: "Shortlist Inclusion Rate", back: "Scenarios where the brand is shortlisted ÷ valid scenarios that produced a shortlist." },
    { front: "RFM", back: "R recency, F frequency, M monetary value — a segmentation model for customer value." },

  ],
  m5_wrapup: "Classic marketing tools are not made obsolete by AI; they become the basic methods for managing AI-mediated markets. The design chain moves from STP to execution, while the measurement and customer management layer runs throughout. The key additions are delegation levels, delegation profiles, dual-track journeys and agent experience, and funnels measured with consistent denominators; CRM should read RFM by channel so that automatic agent behaviour is not mistaken for brand loyalty.",
  m5_q: [
    { q: "In the rebuilt approach, what is the role of the funnel and CRM?", opts: ["The last step of the design chain", "A parallel measurement and customer management layer running through the journey", "Old tools that can be dropped", "Used only after the sale"], ans: _A1, exp: "The funnel measures stage conversion and CRM manages customer value; both run in parallel throughout." },
    { q: "How does a Delegation Profile differ from a Bot Persona?", opts: ["It records task goals, constraints, authority and exceptions without inventing feelings or demographics for the agent", "It gives the agent a gender and age", "They are the same", "It is only for corporate buying"], ans: _A0, exp: "The agent is a decision intermediary, not a segment with its own consumption needs." },

  // ===== M6 =====
  m6_nav: "6. Tools, Organisation, Roadmap & Governance", m6_title: "Tools, Organisation, Roadmap & Governance",
  m6_overview: "Putting strategy into practice needs matching AI and digital tools, cross-functional organisational design, a phased roadmap and risk governance. This module covers the seven-layer tool stack, five aspects of organisational change, a three-phase roadmap and decision gates G1–G4.",
  m6_highlights: ["Seven-layer tool stack", "Data before tools", "Agentic commerce squad", "Data owners", "Decision gates G1–G4", "Risk governance"],
  m6_p1: "Tools follow seven layers: demand and preference (social listening, generative content, influencer management); discovery and evaluation (site search diagnostics, structured data, feed management, AI visibility monitoring, review management); firm agents (agent platforms, marketing automation, AI service agents); commerce interoperability (API gateways, UCP/ACP, AP2, MCP); shared data (PIM, CMS, CDP, knowledge base and RAG, data warehouse); execution and fulfilment (ERP, OMS, POS, CRM, payment and fraud detection, logistics); and measurement and governance (web analytics, BI, A/B testing, MMM, consent management, audit logs).",
  m6_p2: "Data before tools: one correct, complete product master data set that is consistent across channels beats any newly adopted AI tool.",
  m6_p3: "Agentic commerce is not a project the marketing department can finish alone. Structure shifts from separate functions to a cross-functional agentic commerce squad; decision rights shift from approving every activity by hand to humans setting goals and guardrails, agents acting within them, and exceptions going to humans; product and customer data are treated as data products with clear data owners; KPIs add shortlist rate, transaction success and RFM/CLV by channel; and culture becomes experiment- and evidence-driven while keeping brand and ethical judgement.",
  m6_p4: "The roadmap has three phases: 0–3 months for agent-ready information (data audit, baseline KPIs, AI visibility tests); 3–12 months for agent-ready commerce (APIs, authorisation and exception tests, a single-channel pilot); 12–24 months for an agentic business model (wider interoperability, evaluating an own agent, governance audits). Four decision gates guard each phase: G1, is data correct and complete; G2, is agent-channel demand measurable; G3, are authorisation and payment risk controls in place; G4, does incremental margin cover the cost. If G3 fails, autonomous transactions must not be enabled.",
  m6_p5: "Major risks include wrong agent recommendations, stale prices and stock, prompt injection, unauthorised transactions, payment fraud, privacy, conflicts of commercial interest and customer relationships being intermediated. Controls include authoritative data with timestamps, real-time re-confirmation before transactions, separating instructions from data, spending limits and confirmation gates, data minimisation, and disclosure of ads and commissions. Overall, the logic of competition is extending from the attention economy and the recommendation economy to the delegation economy: be trusted by humans, and be chosen by authorised agents.",
  m6_terms: [
    { front: "CDP — Customer Data Platform", back: "Integrates online and store customer data into a single customer view." },
    { front: "PIM — Product Information Management", back: "Centrally manages product specs, images and descriptions so every channel stays consistent." },
    { front: "OMS — Order Management System", back: "Manages cross-channel orders and stock allocation, supporting buy-online-pick-up-in-store." },
    { front: "RAG — Retrieval-Augmented Generation", back: "AI retrieves authoritative documents before answering; live prices and stock should still come from operating systems." },
    { front: "Data Owner", back: "The role that treats product or customer data as a data product and is accountable for its accuracy, updates and access." },
    { front: "Prompt Injection", back: "Hidden instructions in external content that try to steer AI; treat external content as untrusted data and minimise tool permissions." },
    { front: "Delegation Economy", back: "The competitive goal: be trusted by humans and be chosen by authorised agents." }
  ],
  m6_wrapup: "Turning strategy into practice needs tools, organisation and pace working together. Choose tools along the seven layers, but put data before tools; move from separate functions to a cross-functional squad and give every data set an owner; advance in three phases guarded by gates G1–G4, and do not enable autonomous transactions until authorisation and risk controls are ready. Digital marketing thus extends from managing traffic to creating demand, mediating decisions, enabling commerce and managing customer value.",
  m6_q: [
    { q: "What is the main function of a CDP?", opts: ["Managing product specs", "Integrating online and store data into a single customer view", "Running store checkouts", "Producing videos"], ans: _A1, exp: "A CDP is a precondition for OMO and for CRM to assess customer value correctly." },
    { q: "Where should live prices and stock come from?", opts: ["Authoritative operating systems such as ERP and OMS", "Old data in a vector index", "Social media posts", "KOL videos"], ans: _A0, exp: "RAG suits knowledge content; live data should come straight from operating systems." },
    { q: "If decision gate G3 fails, what should happen?", opts: ["Enable autonomous transactions anyway", "Do not enable autonomous transactions", "Expand to every channel", "Stop all data work"], ans: _A1, exp: "G3 checks authorisation, payment risk control and exception handling." },
    { q: "What does a 'data owner' mean?", opts: ["Treating product and customer data as data products with clear owners", "One IT person manages everything", "Data needs no maintenance", "An outsourcer decides everything"], ans: _A0, exp: "Data that nobody owns is one of the most common causes of failure." },
    { q: "What controls address prompt injection?", opts: ["Let agents follow every instruction on web pages", "Widen tool permissions", "Treat external content as untrusted data, separate instructions from data, minimise tool permissions", "Shut down all websites"], ans: _A2, exp: "External content is data, not instructions." },
    { q: "What is the competitive goal of the delegation economy?", opts: ["Be seen by humans", "Be recommended by algorithms", "Cut all prices", "Be trusted by humans and chosen by authorised agents"], ans: _A3, exp: "The attention, recommendation and delegation logics will coexist for a long time." }

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx * groupSize, groupIdx * groupSize + groupSize);
  useEffect(() => {
    setShownSet(prev => { const n = new Set(prev); currentCardIndices.forEach(i => n.add(i)); return n; });
  }, [groupIdx]);
  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const nr = new Set(readSet); nr.add(origIdx); setReadSet(nr);
      if (onCardRead) onCardRead(moduleId, nr.size, shownSet.size, terms.length);
    }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => { const term = terms[origIdx]; return (
          <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
              </div>
            </div>
          </div>); })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)} disabled={groupIdx >= totalGroups - 1} className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qIdx => [...Array(questions[qIdx].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const isRight = (qi) => selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[quizIndices[qi]].ans);
  const totalAnswered = Object.keys(selected).length;
  const correctCount = quizIndices.reduce((c, _, qi) => c + (isRight(qi) ? 1 : 0), 0);
  const statusText = t.quiz_status.replace('{correct}', correctCount).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const groupComplete = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
  const handleGroupSubmit = () => {
    if (!groupComplete) return;
    const ns = { ...submitted, [groupIdx]: true };
    setSubmitted(ns);
    const wrongQs = []; let correct = 0;
    quizIndices.forEach((qIdx, qi) => { if (selected[qi] === undefined) return; if (isRight(qi)) correct++; else wrongQs.push(questions[qIdx].q); });
    onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI; const q = questions[qIdx]; const sMap = shuffledMaps[qi]; const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3 text-base">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const ok = origIdx === _d(q.ans); const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isGrpSub ? (ok ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700') : (isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400')}`}>
                    {q.opts[origIdx]}
                  </button>);
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${isRight(qi) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {isRight(qi) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}{t.explanation === '解析' ? '：' : ': '}{q.exp}
              </p>)}
          </div>);
      })}
      <div className="flex flex-wrap items-center gap-3">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!groupComplete} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups - 1 && <button onClick={() => setGroupIdx(groupIdx + 1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ---------------- App ---------------- */
function App() {
  const LS_KEY = 'AMC_SPA_analytics';
  const LS_STU = 'AMC_SPA_student';
  const blank = () => ({ time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0), quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0), cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {} });
  const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); if (!v) return fb; const o = JSON.parse(v); return o; } catch { return fb; } };
  const initAnalytics = () => {
    const saved = loadLS(LS_KEY, null);
    if (!saved || !Array.isArray(saved.time) || saved.time.length !== TOTAL) return blank();
    const used = saved.time.reduce((a, b) => a + b, 0) > 0;
    if (used && window.confirm(dict.zh.analytics_refresh_prompt + "\n" + dict.en.analytics_refresh_prompt)) { try { localStorage.removeItem(LS_KEY); } catch {} return blank(); }
    return { ...blank(), ...saved };
  };
  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group: '', dept: '', id: '', nameEn: '', nameZh: '' }));
  const [analytics, setAnalytics] = useState(initAnalytics);
  const menuRef = useRef(null);
  const t = dict[lang];

  const modulesList = Array.from({ length: TOTAL }, (_, i) => {
    const nav = i === 0 ? t.m0_nav : i <= NUM_LEARN ? t[`m${i}_nav`] : i === IDX_LAB ? t.mlab_nav : i === IDX_RES ? t.mres_nav : t.mana_nav;
    const title = i === 0 ? t.m0_title : i <= NUM_LEARN ? t[`m${i}_title`] : i === IDX_LAB ? t.mlab_title : i === IDX_RES ? t.mres_title : t.analytics_title;
    return { id: i, num: i, icon: ICONS[i], nav, title };
  });

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en-GB'; }, [lang]);
  useEffect(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => { if (document.visibilityState === 'visible') setAnalytics(a => { const tm = [...a.time]; tm[module] += 1; return { ...a, time: tm }; }); }, 1000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h); document.addEventListener('touchstart', h);
    return () => { document.removeEventListener('mousedown', h); document.removeEventListener('touchstart', h); };
  }, []);
  useEffect(() => { if ('speechSynthesis' in window) { speechSynthesis.cancel(); setTtsState('idle'); } }, [module, lang]);

  const go = (m) => { setModule(m); setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const countClick = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return { ...a, clicks: c }; });
  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setAnalytics(a => { const qc = [...a.quizCorrect], qt = [...a.quizTotal]; qc[mid] = correct; qt[mid] = total; const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || []; return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: wt }; });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => { const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = readCount; ct[mid] = totalCount; return { ...a, cardsRead: cr, cardsTotal: ct }; });
  };

  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const mk = `m${module}`;
      texts = [t[`${mk}_title`], t[`${mk}_overview`], ...(t[`${mk}_highlights`] || []), ...[1, 2, 3, 4, 5].map(n => t[`${mk}_p${n}`]).filter(Boolean), t[`${mk}_wrapup`], ...(t[`${mk}_terms`] || []).flatMap(tm => [tm.front, tm.back])];
    } else if (module === IDX_LAB) {

          {page}
          <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
            <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0} className="px-4 py-2 rounded-lg border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold disabled:opacity-0">{t.nav_prev}</button>
            <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1} className="px-4 py-2 rounded-lg bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold disabled:opacity-0">{t.nav_next}</button>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-3 sm:px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
